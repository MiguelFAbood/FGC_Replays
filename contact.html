<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replays HUB - Contact Us</title>
    <link rel="icon" href="icon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scanlines"></div>

    <nav class="navbar chrome-border-bottom">
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="FGC Replays Hub Logo"></a>
        </div>
        
        <form class="search-container" action="#" method="GET">
            <input type="text" class="search-input" placeholder="SEARCH..." aria-label="Search">
            <button type="submit" class="search-btn" aria-label="Submit Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </form>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="upload.html">Upload</a></li>
            <li><a href="contact.html" class="active">Contact Us</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <main class="main-container">
        <div class="hud-top-bar">
            <span class="hud-code">LOC :: CONTACT_COMM</span>
        </div>

        <section class="metal-card halftone-bg form-card">
            <div class="card-header">
                <h2>CONTACT US</h2>
                <span class="hud-tag">SYS // TRANSMIT</span>
            </div>

            <form class="cyber-form" action="#" method="POST">
                <div class="form-group">
                    <label for="contact-name">NAME</label>
                    <input type="text" id="contact-name" name="name" class="cyber-input" placeholder="YOUR NAME" required>
                </div>

                <div class="form-group">
                    <label for="contact-email">EMAIL ADDRESS</label>
                    <input type="email" id="contact-email" name="email" class="cyber-input" placeholder="USER@DOMAIN.COM" required>
                </div>

                <div class="form-group">
                    <label for="contact-subject">SUBJECT</label>
                    <input type="text" id="contact-subject" name="subject" class="cyber-input" placeholder="INQUIRY / FEEDBACK" required>
                </div>

                <div class="form-group">
                    <label for="contact-message">MESSAGE</label>
                    <textarea id="contact-message" name="message" class="cyber-textarea" placeholder="WRITE YOUR TRANSMISSION HERE..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="cyber-btn">SEND TRANSMISSION</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
