<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replays HUB - Login</title>
    <link rel="icon" href="icon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scanlines"></div>

    <nav class="navbar chrome-border-bottom">
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="FGC Replays Hub Logo"></a>
        </div>
        
        <form class="search-container" action="#" method="GET">
            <input type="text" class="search-input" placeholder="SEARCH..." aria-label="Search">
            <button type="submit" class="search-btn" aria-label="Submit Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </form>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="upload.html">Upload</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <main class="main-container">
        <div class="hud-top-bar">
            <span class="hud-code">LOC :: AUTHENTICATION</span>
        </div>

        <section class="metal-card halftone-bg login-card">
            <div class="card-header" id="auth-card">
                <h2>USER LOGIN</h2>
                <span class="hud-tag">SYS // ACCESS_CONTROL</span>
            </div>

            <p class="review-notice auth-demo-notice">
                LOCAL DEMO ONLY: accounts are stored in accounts.json. Do not use real passwords or expose this server to the internet.
            </p>
            <p id="auth-status" class="auth-status" role="status" aria-live="polite" hidden></p>

            <div id="login-panel">
                <form class="cyber-form auth-form" id="login-form">
                    <div class="form-group">
                        <label for="login-identifier">USERNAME OR EMAIL</label>
                        <input type="text" id="login-identifier" name="identifier" class="cyber-input" placeholder="ENTER USERNAME OR EMAIL" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">PASSWORD</label>
                        <input type="password" id="login-password" name="password" class="cyber-input" placeholder="ENTER PASSWORD" autocomplete="current-password" required>
                    </div>

                    <div class="form-actions auth-actions">
                        <button type="submit" class="cyber-btn">AUTHENTICATE</button>
                    </div>
                </form>
                <p class="auth-switch-row">NEW PLAYER? <button type="button" class="auth-switch" id="show-signup">CREATE ACCOUNT</button></p>
            </div>

            <div id="signup-panel" hidden>
                <form class="cyber-form auth-form" id="signup-form">
                    <div class="form-group">
                        <label for="signup-username">USERNAME</label>
                        <input type="text" id="signup-username" name="username" class="cyber-input" placeholder="3-24 CHARACTERS: A-Z, 0-9, . _ -" minlength="3" maxlength="24" pattern="[A-Za-z0-9._\-]{3,24}" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">EMAIL ADDRESS</label>
                        <input type="email" id="signup-email" name="email" class="cyber-input" placeholder="USER@DOMAIN.COM" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">PASSWORD</label>
                        <input type="password" id="signup-password" name="password" class="cyber-input" placeholder="AT LEAST 8 CHARACTERS" minlength="8" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm-password" class="cyber-input" placeholder="RE-ENTER PASSWORD" minlength="8" autocomplete="new-password" required>
                    </div>

                    <div class="form-actions auth-actions">
                        <button type="submit" class="cyber-btn">CREATE ACCOUNT</button>
                    </div>
                </form>
                <p class="auth-switch-row">ALREADY REGISTERED? <button type="button" class="auth-switch" id="show-login">BACK TO LOGIN</button></p>
            </div>

            <div id="auth-session" class="auth-session" hidden>
                <p>SESSION ACTIVE FOR <strong data-auth-username></strong> · ROLE: <strong data-auth-role></strong>.</p>
                <button type="button" class="cyber-btn" id="logout-button">SIGN OUT</button>
            </div>
        </section>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
