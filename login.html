<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replays HUB - Login</title>
    <link rel="icon" href="icon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scanlines"></div>

    <nav class="navbar chrome-border-bottom">
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="FGC Replays Hub Logo"></a>
        </div>
        
        <form class="search-container" action="#" method="GET">
            <input type="text" class="search-input" placeholder="SEARCH..." aria-label="Search">
            <button type="submit" class="search-btn" aria-label="Submit Search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </form>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="upload.html">Upload</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <main class="main-container">
        <div class="hud-top-bar">
            <span class="hud-code">LOC :: AUTHENTICATION</span>
        </div>

        <section class="metal-card halftone-bg login-card">
            <div class="card-header">
                <h2>USER LOGIN</h2>
                <span class="hud-tag">SYS // ACCESS_CONTROL</span>
            </div>

            <form class="cyber-form" action="#" method="POST">
                <div class="form-group">
                    <label for="username">USERNAME / USER ID</label>
                    <input type="text" id="username" name="username" class="cyber-input" placeholder="ENTER USERNAME" required>
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" class="cyber-input" placeholder="••••••••" required>
                </div>

                <div class="form-actions" style="justify-content: space-between;">
                    <a href="#" style="color: var(--accent-silver); font-size: 0.8rem; text-decoration: none; font-family: var(--font-mono);">FORGOT PASSWORD?</a>
                    <button type="submit" class="cyber-btn">AUTHENTICATE</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
